name: MEX controller check

on:
  workflow_dispatch:
    inputs:
      platform:
        description: Controller platform to validate
        required: true
        type: choice
        options:
          - linux-x86_64
          - windows-x86_64
          - macos-x86_64
          - macos-arm64
      probe:
        description: Run configured non-build appliance probe
        required: true
        default: false
        type: boolean
      octave_version:
        description: Exact preserved Octave version configured for this platform
        required: true
        type: string

permissions:
  contents: read

jobs:
  queue-watchdog:
    name: Bound controller queue time
    runs-on: ubuntu-24.04
    timeout-minutes: 7
    permissions:
      actions: write
      contents: read
    steps:
      - name: Cancel if selected controller never starts
        env:
          GH_TOKEN: ${{ github.token }}
          PLATFORM: ${{ inputs.platform }}
        run: |
          case "$PLATFORM" in
            linux-x86_64) target='Check Linux x86_64 controller' ;;
            windows-x86_64) target='Check Windows x86_64 controller' ;;
            macos-x86_64) target='Check macOS x86_64 controller' ;;
            macos-arm64) target='Check macOS arm64 controller' ;;
            *) echo "Unsupported platform: $PLATFORM" >&2; exit 2 ;;
          esac
          for attempt in $(seq 1 20); do
            status="$(gh api \
              "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/jobs?per_page=100" \
              --jq ".jobs[] | select(.name == \"$target\") | .status" \
              | head -n 1)"
            case "$status" in
              in_progress|completed)
                echo "$target reached status $status."
                exit 0
                ;;
              queued|"")
                sleep 15
                ;;
              *)
                echo "$target has unexpected status: $status" >&2
                exit 1
                ;;
            esac
          done
          echo "$target did not start within five minutes; cancelling this readiness run." >&2
          gh api \
            --method POST \
            "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/cancel"
          exit 1

  linux:
    name: Check Linux x86_64 controller
    if: inputs.platform == 'linux-x86_64'
    timeout-minutes: 10
    runs-on: [self-hosted, mex-controller, linux, x64]
    steps:
      - uses: actions/checkout@v7
      - name: Validate controller and MATLAB R2011a appliance mapping
        env:
          OCTAVE_VERSION: ${{ inputs.octave_version }}
        run: >-
          python3 ci/legacy/check_controller.py
          --platform linux-x86_64
          --require matlab:R2011a
          --require "octave:$OCTAVE_VERSION"
          ${{ inputs.probe && '--probe' || '' }}

  windows:
    name: Check Windows x86_64 controller
    if: inputs.platform == 'windows-x86_64'
    timeout-minutes: 10
    runs-on: [self-hosted, mex-controller, windows, x64]
    steps:
      - uses: actions/checkout@v7
      - name: Validate controller and MATLAB R2011a appliance mapping
        shell: pwsh
        env:
          OCTAVE_VERSION: ${{ inputs.octave_version }}
          RUN_PROBE: ${{ inputs.probe && 'true' || 'false' }}
        run: |
          $args = @(
            'ci/legacy/check_controller.py',
            '--platform', 'windows-x86_64',
            '--require', 'matlab:R2011a',
            '--require', "octave:$env:OCTAVE_VERSION"
          )
          if ($env:RUN_PROBE -eq 'true') {
            $args += '--probe'
          }
          python @args

  macos-x64:
    name: Check macOS x86_64 controller
    if: inputs.platform == 'macos-x86_64'
    timeout-minutes: 10
    runs-on: [self-hosted, mex-controller, macos, x64]
    steps:
      - uses: actions/checkout@v7
      - name: Validate controller and MATLAB R2011a appliance mapping
        env:
          OCTAVE_VERSION: ${{ inputs.octave_version }}
        run: >-
          python3 ci/legacy/check_controller.py
          --platform macos-x86_64
          --require matlab:R2011a
          --require "octave:$OCTAVE_VERSION"
          ${{ inputs.probe && '--probe' || '' }}

  macos-arm64:
    name: Check macOS arm64 controller
    if: inputs.platform == 'macos-arm64'
    timeout-minutes: 10
    runs-on: [self-hosted, mex-controller, macos, arm64]
    steps:
      - uses: actions/checkout@v7
      - name: Validate controller and MATLAB R2023b appliance mapping
        env:
          OCTAVE_VERSION: ${{ inputs.octave_version }}
        run: >-
          python3 ci/legacy/check_controller.py
          --platform macos-arm64
          --require matlab:R2023b
          --require "octave:$OCTAVE_VERSION"
          ${{ inputs.probe && '--probe' || '' }}
