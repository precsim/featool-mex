name: Retry published release consumer validation

on:
  workflow_run:
    workflows:
      - Published release consumer validation
    types:
      - completed

permissions:
  actions: write
  contents: read

jobs:
  retry-hosted-runner:
    name: Retry hosted-runner acquisition failure
    if: github.event.workflow_run.conclusion == 'failure'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out retry classifier
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.repository.default_branch }}

      - name: Inspect failed consumer attempt
        id: classify
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ github.event.workflow_run.id }}
          RUN_ATTEMPT: ${{ github.event.workflow_run.run_attempt }}
        run: |
          gh api \
            "/repos/$GITHUB_REPOSITORY/actions/runs/$RUN_ID/attempts/$RUN_ATTEMPT/jobs?per_page=100" \
            > "$RUNNER_TEMP/consumer-jobs.json"
          python3 ci/classify_consumer_retry.py \
            "$RUNNER_TEMP/consumer-jobs.json" \
            --run-attempt "$RUN_ATTEMPT" \
            --max-attempts 3

      - name: Re-run failed consumer jobs
        if: steps.classify.outputs.retry == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ github.event.workflow_run.id }}
        run: >-
          gh api --method POST
          "/repos/$GITHUB_REPOSITORY/actions/runs/$RUN_ID/rerun-failed-jobs"
